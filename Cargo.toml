[package]
name = "llama-gag"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible proxy that detects repeated-content loops in llama-server streaming responses and transparently continues generation."
license = "MIT"

[[bin]]
name = "llama-gag"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
# Upstream HTTP client (streaming)
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# CLI
clap = { version = "4", features = ["derive"] }
# Async utilities
futures-util = "0.3"
bytes = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
